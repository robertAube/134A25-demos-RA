<!DOCTYPE html>
<html lang="fr-CA">
<head>
    <meta charset="UTF-8">
    <title>Demo Inline-Block</title>
    <style>
        .carte {
            width: 150px;
            height: 100px;
            margin-bottom: 10px;
            background-color: lightblue;
            text-align: center;
            vertical-align: top;
            line-height: 100px;
            font-weight: bold;
            border-radius: 8px;
        }
        .inline-block {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="carte">Carte 1</div>
    <div class="carte inline-block">Carte 2</div>
    <div class="carte inline-block">Carte 3</div>
    <div class="carte inline-block">Carte 4</div>
    <div class="carte inline-block">Carte 5</div>
    <div class="carte inline-block">Carte 6</div>
    <div class="carte inline-block">Carte 7</div>
    <div class="carte">Carte 8</div>
</body>
</html>
