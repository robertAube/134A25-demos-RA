<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8">
  <title>Exemple de ::first-letter</title>
  <style> /* ne jamais mettre le style directement dans le html, mais plutôt dans les fichiers css */
    p::first-letter { /* modifier l’apparence de la première lettre du texte d’un élément */
      font-size: 2em;
      color: red;
    }
  </style>
</head>
<body>
  <h1>Exemple de ::first-letter</h1>
  <p>Ceci est un exemple 1 de texte.</p>
  <p>Ceci est un exemple 2 de texte.</p>
</body>
</html>
