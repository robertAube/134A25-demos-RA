<!DOCTYPE html>
<html lang="fr-CA" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Pseudo classe</title>
    <style> /* ne jamais mettre le style directement dans le html, mais plutôt dans les fichiers css */

        /* les sélecteurs avec deux-points (:) sont utilisés pour cibler des pseudo-classes. */
        /* Une pseudo-classe permet de sélectionner des éléments en fonction de leur état, position, ou caractéristiques dynamiques.

        /* :link - pour styliser un lien non visité */
        a:link {
            color: red;
        }

        /* :visited - pour styliser un lien une fois celui-ci visité */
        a:visited {
            color: orange;
        }

        /* :hover - pour changer l’aspect d’un élément lorsque le curseur (souris) est dessus */
        h1:hover {
            color: green;
        }

    </style>
</head>
<body>
    <h1>Les pseudo classes</h1>
    <ul>
        <li><a href="https://www.volvodequebec.com">volvodequebec.com</a> </li>
        <li><a href="https://wikimanche.fr">wikimanche.fr</a> </li>
        <li><a href="https://www.voyageursdumonde.ca">voyageursdumonde.ca</a> </li>
        <li><a href="https://www.cabanomarine.com">cabanomarine.com</a> </li>
        <li><a href="https://www.beneteau.com">beneteau.com</a> </li>
        <li><a href="https://www.yachtworld.fr">yachtworld.fr</a> </li>
    </ul>
</body>
</html>
