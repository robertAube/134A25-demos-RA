<!DOCTYPE html>
<html lang="fr-CA">
<head>
    <meta charset="UTF-8">
    <title>Exemple de background-color</title>
    <style> /* ne jamais mettre le style directement dans le html, mais plut?t dans les fichiers css */
        body {
            background-color: cornflowerblue; /* Couleur de fond de la page */
        }
        h1 {
            background-color: darkorange; /* Couleur de fond de la page */
        }
        p {
            background-color: lightblue; /* Couleur de fond du paragraphe */
            padding: 10px; /* Ajout de padding pour un meilleur rendu visuel */
        }
    </style>
</head>
<body>
    <h1>Exemple de background-color</h1>
    <p>Ceci est un exemple de paragraphe avec une couleur de fond.</p>
</body>
</html>
