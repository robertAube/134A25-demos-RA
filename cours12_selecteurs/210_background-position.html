<!DOCTYPE html>
<html lang="fr-CA">
<head>
    <meta charset="UTF-8">
    <title>Exemple de background-position</title>
    <style> /* ne jamais mettre le style directement dans le html, mais plut?t dans les fichiers css */
        .example1 {
            background-image: url('../_images/c2b_625x380.jpg');
            background-position: top left;
            background-repeat: no-repeat;
            height: 380px;
        }
        .example2 {
            background-image: url('../_images/c2b_625x380.jpg');
            background-position: 50% 50%;
            background-repeat: no-repeat;
            height: 200px;
        }
        .example3 {
            background-image: url('../_images/c2b_625x380.jpg');
            background-position: 10px 20px;
            background-repeat: no-repeat;
            height: 200px;
        }
    </style>
</head>
<body>
    <h1>Exemple de background-position</h1>
    <div class="example1">Exemple 1: top left</div>
    <div class="example2">Exemple 2: 50% 50%</div>
    <div class="example3">Exemple 3: 10px 20px</div>
</body>
</html>
