<!DOCTYPE html>
<html lang="fr-CA">
<head>
    <meta charset="UTF-8">
    <title>Sans Flexbox</title>
    <style> /* ne jamais mettre le style directement dans le html, mais plutôt dans les fichiers css */
    .container {
        border: 2px solid black;
    }

    .container > div {  /* tous les div enfant direct de c1 */
        padding: 20px;
    }

    .e1 {
        background-color: yellowgreen;
    }

    .e2 {
        background-color: cornflowerblue;
    }

    .e3 {
        background-color: peru;
    }
    </style>
</head>
<body>
    <div class="container">
        <div class="e1">Élément 1</div>
        <div class="e2">Élément 2</div>
        <div class="e3">Élément 3</div>
    </div>
</body>
</html>
