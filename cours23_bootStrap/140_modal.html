<!DOCTYPE html>
<html lang="fr-CA">
<head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container">
    <h3>Exemple fenêtre modal</h3>
    <p>Appuyer sur le bouton.</p>

    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#maFenetreModal">
        Ouvrir la fenêtre
    </button>
</div>

<!--La fenêtre Modal -->
<div id="maFenetreModal" class="modal fade">
    <div class="modal-dialog">
        <div class="modal-content">

            <!-- Modal Header -->
            <div class="modal-header">
                <h4 class="modal-title">Titre de la fenêtre</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <!-- Modal body -->
            <div class="modal-body">
                Lorem ipsum dolor sit amet, consectetur adipisicing elit. Deserunt dicta earum exercitationem
                fuga itaque, laboriosam mollitia nihil numquam
                qui sint tempore tenetur vel? Assumenda facilis fuga minus quibusdam, sapiente voluptatum.
            </div>

            <!-- Modal footer -->
            <div class="modal-footer">
                <button type="button" class="btn btn-dark" data-bs-dismiss="modal">Fermer</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
