<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Couleurs Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" >

</head>
<body >
    <h1 class="text-center">Couleurs Bootstrap avec noms officiels</h1>
    <div class="container">
        <div class="row"> <!-- row -> mettre en ligne -->
                <div class="col-xl-1 text-bg-primary text-center">primary</div> <!-- .col-xl -> largeur d'écran égale ou supérieure à 1200 px; -1 -> 1 → Dans un système de grilles, la colonne occupe 1/12 de la largeur disponible -->
                <div class="col-xl-1 text-bg-secondary text-center">secondary</div>
                <div class="col-xl-1 text-bg-success text-center">success</div>
                <div class="col-xl-1 text-bg-danger text-center">danger</div>
                <div class="col-xl-1 text-bg-warning text-center">warning</div>
                <div class="col-xl-1 text-bg-info text-center">info</div>
                <div class="col-xl-1 text-bg-light text-center">light</div>
                <div class="col-xl-1 text-bg-dark text-center">dark</div>
        </div>
    </div>
    </body>
</html>
