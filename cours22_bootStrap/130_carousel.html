<!DOCTYPE html>
<html lang="fr-CA">
<head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container">
    <h1>Carrousel bootstrap</h1>
    <!-- Carousel -->
    <div id="demo" class="carousel slide" data-bs-ride="carousel">
        <!-- Le carrousel -->
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="images/img1-grandeRoue_1620x1080.jpg" class="d-block w-100 ">
            </div>
            <div class="carousel-item">
                <img src="images/img2-bateaux_1920x1280.jpg" class="d-block w-100">
            </div>
            <div class="carousel-item">
                <img src="images/img3-montages_1820x1280.jpg" class="d-block w-100">
            </div>
        </div>

        <!-- Les indicateurs (boutons du bas) -->
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
        </div>

        <!-- Boutons droite/gauche -->
        <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>
</div>

</body>
</html>
