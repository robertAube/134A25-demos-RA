<!DOCTYPE html>
<html lang="fr-CA">
<head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <div class="container pt-3">
        <h1>Conteneur réactif</h1>
        <p>Ajuster la taille du navigateur pour voir la différence.</p>
    </div>

    <div class="bg-info container-sm border">.container-sm</div> <!-- bg-info -> couleur info pour le background -->
    <div class="bg-success container-md mt-3 border">.container-md</div> <!-- bg-succes -> couleur succes pour le background -->
    <div class="bg-info container-lg mt-3 border">.container-lg</div>
    <div class="bg-success container-xl mt-3 border">.container-xl</div>
    <div class="bg-info container-xxl mt-3 border">.container-xxl</div>

</body>
</html>
