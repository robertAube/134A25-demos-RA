<!DOCTYPE html>
<html lang="fr-CA">
<head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <h3>Encadrement de l'image</h3>
    <div class="container-fluid">
        <img src="images/img1-grandeRoue_1620x1080.jpg" class="rounded" width="400" height="300" title="rounded">
        <img src="images/img2-bateaux_1920x1280.jpg" class="rounded-circle" width="400" height="300" title="rounded-circle">
        <img src="images/img3-montages_1820x1280.jpg" class="img-thumbnail" width="400" height="300" title="img-thumbnail">
    </div>

    <h3>Position de l'image</h3>
    <div class="container-fluid">
        <img src="images/img1-grandeRoue_1620x1080.jpg" class="float-end" width="400" height="300" title="float-end">
        <img src="images/img2-bateaux_1920x1280.jpg" class="float-start" width="400" height="300" title="float-start">
        <img src="images/img3-montages_1820x1280.jpg" class="mx-auto d-block" width="400" height="300" title="mx-auto d-block">
    </div>

    <h3>Images réactives (s'ajustent automatiquement à la taille de l'écran)</h3>
    <div class="container-fluid">
        <img src="images/img1-grandeRoue_1620x1080.jpg" class="img-fluid" title="img-fluid">
    </div>
</body>
</html>
