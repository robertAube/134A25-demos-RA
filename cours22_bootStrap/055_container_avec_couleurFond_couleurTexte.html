<!DOCTYPE html>
<html lang="fr-CA">
<head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="container bg-dark text-white">
    <h1>Couleur de fond et couleur de texte</h1>

    <h3>bg-dark</h3>
    <p>Applique un fond sombre (couleur noire/gris foncé).<br>
        Fait partie des classes utilitaires de couleur de fond.<br>
    </p>

    <h3>text-white</h3>
    <p>Rend le texte blanc pour contraster avec le fond sombre.<br>
        Idéal pour la lisibilité sur un fond foncé.<br>
    </p>
</div>

</body>
</html>
