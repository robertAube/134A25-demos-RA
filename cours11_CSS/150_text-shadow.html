<!DOCTYPE html>
<html lang="fr-CA">
<head>
    <meta charset="UTF-8">
    <title>Exemple de Text-Shadow</title>
    <style> /* ne jamais mettre le style directement dans le html, mais plutôt dans les fichiers css */
        body {
            font-family: Arial, sans-serif;
            text-shadow: 3px 2px;
        }

    /* text-shadow: décalage-x décalage-y flou couleur; */
        .none {
            text-shadow: none;
        }
        .simple-shadow {
            /* 3px → décalage horizontal (vers la droite); 2px → décalage vertical (vers le bas) */
            text-shadow: 3px 2px;
        }
        .simple-shadowNegatifBleu {
            /* -2px → décalage horizontal (vers la droite); 3px → décalage vertical (vers le bas); bleu*/
            text-shadow: -2px 3px blue;
        }
        .blurred-shadow-gray {
            /* 2px → vers la droite; 2px → vers le bas; 5px → rayon de flou; gris*/
            text-shadow: 2px 2px 5px gray;
        }
        .colored-shadow-red {
            /* 2px → vers la droite; 2px → vers le bas; 5px → rayon de flou; orange*/
            text-shadow: 2px 2px 5px red;
        }
        .colored-shadowCentre-orange {
            /* 0px → vers la droite; 0px → vers le bas; 5px → rayon de flou; orange*/
            text-shadow: 0px 0px 5px orange;
        }
        .multiple-shadows {
            text-shadow: 1px 1px 2px black, 0 0 5px blue, 0 0 10px red;
        }
    </style>
</head>
<body>
    <h1>Exemple de Text-Shadow</h1>
    <p class="none">Sans ombre (none).</p>
    <p class="simple-shadow">Ombre simple (3px 2px).</p>
    <p class="simple-shadowNegatifBleu">Ombre simple (-2px 2px) blue.</p>
    <p class="blurred-shadow-gray">Ombre floue (2px 2px 5px gray).</p>
    <p class="colored-shadow-red">Ombre colorée (2px 2px 5px red).</p>
    <p class="colored-shadowCentre-orange">Ombre centrée ( 0px 0px 5px Orange).</p>
    <p class="multiple-shadows">
        Plusieurs ombres (1px 1px 2px black, 0 0 5px blue, 0 0 10px red).
    </p>
</body>
</html>
